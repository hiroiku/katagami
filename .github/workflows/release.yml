name: Release

on:
  push:
    branches: [master]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: bun install --frozen-lockfile

      - run: bun run verify

      - name: Get version from package.json
        id: version
        run: echo "version=v$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Check if release already exists
        id: check
        run: |
          if gh release view "${{ steps.version.outputs.version }}" &>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create GitHub Release
        if: steps.check.outputs.exists == 'false'
        run: |
          gh release create "${{ steps.version.outputs.version }}" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            --title "${{ steps.version.outputs.version }}"
        env:
          GH_TOKEN: ${{ github.token }}

      # Releases created by GITHUB_TOKEN do not trigger release-event workflows.
      # Dispatch the configured trusted-publisher workflow explicitly at this commit.
      - name: Publish the new release
        if: steps.check.outputs.exists == 'false'
        run: gh workflow run publish.yml --ref master -f ref="${GITHUB_SHA}"
        env:
          GH_TOKEN: ${{ github.token }}
